name: Something on the site is broken
description: A page that looks wrong, a link that goes nowhere, a typo
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page, copied from the browser.
      placeholder: https://farulivan.com/work
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: And what you expected instead. A screenshot helps.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari on an iPhone, Chrome on Windows
