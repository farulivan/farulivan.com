name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The default token is read-write on a public repository; nothing here writes.
permissions:
  contents: read

# A superseded push stops burning runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # package.json declares node >=22.12; both ends of that get tested.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          # The Sätteri modified-time plugin reads `git log`. The default
          # shallow checkout would resolve every post to the same commit.
          # (Vercel clones at depth 2 and cannot be configured, which is why
          # frontmatter `updatedDate` is the source of truth — see
          # docs/ARCHITECTURE.md.)
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check spelling
        run: pnpm spell

      - name: Check architecture rules
        run: pnpm check:arch

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      # `pnpm build` would run `astro check` a second time; the step above
      # already did, and a failure there names itself more clearly.
      - name: Build
        run: pnpm build:fast

  # Not on pull requests while the site is still being built.
  #
  # It runs three times over every page in both languages, which takes about
  # seven and a half minutes and runs after `verify` finishes — so it was
  # turning a one-minute check into a nine-minute one, to score pages that are
  # still placeholders. It runs on main, and on demand from the Actions tab.
  #
  # Put `pull_request` back once the real pages and content land: the design
  # asks for 95 on performance and 100 on accessibility, and that is a promise
  # worth blocking a merge over — just not yet.
  lighthouse:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:fast

      # Three runs, median taken. With one run the first URL audited
      # absorbs Chrome's cold start on a shared runner — that alone put
      # 749ms of total blocking time on a page that ships no JavaScript,
      # and failed a budget every other page passed.
      - name: Lighthouse budget
        run: pnpm dlx @lhci/cli@0.15.1 autorun

      # Without this a failed budget prints a score and discards the report,
      # which is not enough to diagnose it from a pull request.
      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci
          retention-days: 7
