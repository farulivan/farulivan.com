name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The default token is read-write on a public repository; nothing here writes.
#
# Every action is pinned to a commit, with its version in the comment beside
# it. A tag can be moved to point at any code, which is how a compromised
# action reaches every repository that trusts the tag; a commit cannot be
# moved. Dependabot updates the commit and the comment together.
permissions:
  contents: read

# A superseded push stops burning runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # package.json declares node >=22.12; both ends of that get tested.
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Sätteri modified-time plugin reads `git log`. The default
          # shallow checkout would resolve every post to the same commit.
          # (Vercel clones at depth 2 and cannot be configured, which is why
          # frontmatter `updatedDate` is the source of truth — see
          # docs/ARCHITECTURE.md.)
          fetch-depth: 0
          # Nothing pushes, so the token has no reason to be left in
          # .git/config where every later step could read it.
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check spelling
        run: pnpm spell

      - name: Check architecture rules
        run: pnpm check:arch

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      # `pnpm build` would run `astro check` a second time; the step above
      # already did, and a failure there names itself more clearly.
      - name: Build
        run: pnpm build:fast

      # The last step of `pnpm verify`, which promises to be the same gate as
      # CI. A class with no rule behind it fails silently in the browser, so
      # this is the only place it fails at all.
      - name: Check every class has a rule
        run: pnpm check:classes

  # Not on pull requests while the site is still being built.
  #
  # It runs three times over every page in both languages, which takes about
  # seven and a half minutes and runs after `verify` finishes — so it was
  # turning a one-minute check into a nine-minute one, to score pages that are
  # still placeholders. It runs on main, and on demand from the Actions tab.
  #
  # Put `pull_request` back once the real pages and content land: the design
  # asks for 95 on performance and 100 on accessibility, and that is a promise
  # worth blocking a merge over — just not yet.
  lighthouse:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:fast

      # Three runs, median taken. With one run the first URL audited
      # absorbs Chrome's cold start on a shared runner — that alone put
      # 749ms of total blocking time on a page that ships no JavaScript,
      # and failed a budget every other page passed.
      - name: Lighthouse budget
        run: pnpm dlx @lhci/cli@0.15.1 autorun

      # Without this a failed budget prints a score and discards the report,
      # which is not enough to diagnose it from a pull request.
      - name: Upload Lighthouse report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci
          retention-days: 7
