# pnpm 11 refuses to run a dependency's install scripts unless it is approved
# here (strictDepBuilds). Both of these genuinely need theirs: esbuild fetches
# its native binary, sharp its libvips bindings for image optimization.
allowBuilds:
  esbuild: true
  sharp: true

# pnpm 11 already waits a day before installing a new release and refuses git
# or tarball dependencies below the top level. This adds the third check: a
# release published with weaker provenance than the ones before it is refused,
# because a stolen publish token cannot reproduce a signed CI build. That is
# what a takeover looks like from the outside.
#
# Only for releases under 30 days old. Past that, a malicious one has
# almost always been found and pulled, and older packages lost provenance for
# dull reasons: chokidar 4.0.3, under @astrojs/check, fails the check from
# 2024 and is fine.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # minutes

# Security fixes Dependabot cannot reach, because the package that needs each
# one pins the vulnerable version exactly and has no release that moves off
# it. Each selector matches only the vulnerable range, so it stops applying on
# its own once the parent moves on; delete it then.
overrides:
  # @tailwindcss/typography 0.5.20 pins 6.0.10 (GHSA-rj75-hqrm-r3gf).
  "postcss-selector-parser@~6.0.0": 6.1.5
